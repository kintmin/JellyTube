name: Release

# PR 마다 브랜치 규칙을 보고, main 으로 가는 PR 에서는 버전을 대조한다.
# main 에 들어오면 태그를 붙이고 develop 에 반영하고, 새 mobile 버전이면 APK·IPA 를 GitHub Release 에 올린다.
on:
  pull_request:
  push:
    branches: [main]
  # 릴리스 없이 APK·IPA 만 빌드해 artifact 로 남긴다. 서명 시크릿을 릴리스 전에 확인하는 용도다.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  branch-rule:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check where the branch may be merged
        env:
          HEAD: ${{ github.head_ref }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          echo "$HEAD → $BASE"
          if [[ "$BASE" == main && ! "$HEAD" =~ ^(release|hotfix)/ ]]; then
            echo "::error::main 에는 release/* 와 hotfix/* 만 병합한다."; exit 1
          fi
          if [[ "$HEAD" =~ ^(release|hotfix)/ && "$BASE" != main ]]; then
            echo "::error::$HEAD 는 main 에만 병합한다."; exit 1
          fi
          if [[ "$BASE" == develop && ! "$HEAD" =~ ^(feat|fix|refactor|perf|test|build|ci|docs|revert)/ ]]; then
            echo "::error::develop 에는 feat/ fix/ refactor/ perf/ test/ build/ ci/ docs/ revert/ 브랜치만 병합한다."; exit 1
          fi

  versions:
    if: github.event_name == 'push' || github.base_ref == 'main'
    runs-on: ubuntu-latest
    outputs:
      mobile: ${{ steps.read.outputs.mobile }}
      desktop: ${{ steps.read.outputs.desktop }}
    steps:
      - uses: actions/checkout@v4
      - id: read
        name: Read and cross-check versions
        run: |
          set -euo pipefail
          config=buildSrc/src/main/java/com/kintmin/buildSrc/AppConfiguration.kt
          pbxproj=ios/app/JellyTubeIos.xcodeproj/project.pbxproj
          value() { sed -n "s/^ *const val $1 = \"\{0,1\}\([^\"]*\)\"\{0,1\}\$/\1/p" "$config"; }
          name=$(value VERSION_NAME); code=$(value VERSION_CODE); desktop=$(value DESKTOP_VERSION_NAME)
          ios_names=$(sed -n 's/.*MARKETING_VERSION = \(.*\);/\1/p' "$pbxproj" | sort -u)
          ios_codes=$(sed -n 's/.*CURRENT_PROJECT_VERSION = \(.*\);/\1/p' "$pbxproj" | sort -u)
          echo "android=$name($code) ios=$ios_names($ios_codes) desktop=$desktop"
          [[ -n "$name" && -n "$code" && -n "$desktop" ]] || { echo "::error::버전을 읽지 못했다"; exit 1; }
          [[ "$ios_names" == "$name" ]] || { echo "::error::iOS MARKETING_VERSION($ios_names) 이 VERSION_NAME($name) 과 다르다"; exit 1; }
          [[ "$ios_codes" == "$code" ]] || { echo "::error::iOS CURRENT_PROJECT_VERSION($ios_codes) 이 VERSION_CODE($code) 와 다르다"; exit 1; }
          echo "mobile=$name" >> "$GITHUB_OUTPUT"
          echo "desktop=$desktop" >> "$GITHUB_OUTPUT"

  tag:
    if: github.event_name == 'push'
    needs: versions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag versions that are not tagged yet
        env:
          MOBILE: ${{ needs.versions.outputs.mobile }}
          DESKTOP: ${{ needs.versions.outputs.desktop }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for tag in "mobile/v$MOBILE" "desktop/v$DESKTOP"; do
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "$tag 은 이미 있다"
            else
              git tag -a "$tag" -m "$tag" "$GITHUB_SHA"
              git push origin "refs/tags/$tag"
            fi
          done

  mobile-release-needed:
    if: github.event_name == 'push'
    needs: [versions, tag]
    runs-on: ubuntu-latest
    outputs:
      needed: ${{ steps.check.outputs.needed }}
    steps:
      - id: check
        env:
          TAG: mobile/v${{ needs.versions.outputs.mobile }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$TAG 릴리스는 이미 있다"
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
          fi

  android-apk:
    needs: mobile-release-needed
    # 수동 실행에서는 앞 job 이 건너뛰어지므로, 건너뛴 의존을 막지 않게 !cancelled() 로 연다.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.mobile-release-needed.outputs.needed == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      # Chaquopy 가 빌드 때 pip 로 패키지를 받으려면 앱과 같은 버전의 Python 이 PATH 에 있어야 한다.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.JELLY_TUBE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.JELLY_TUBE_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.JELLY_TUBE_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.JELLY_TUBE_KEY_PASSWORD }}
          SENTRY_AUTH_TOKEN: ${{ secrets.JELLY_TUBE_SENTRY_AUTH_TOKEN }}
        run: |
          set -euo pipefail
          # 키가 없어도 release 는 서명 없이 빌드되므로, 여기서 막지 않으면 설치할 수 없는 APK 가 올라간다.
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "::error::JELLY_TUBE_$name 시크릿이 없다"; exit 1; }
          done
          keystore="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          export ORG_GRADLE_PROJECT_JELLY_TUBE_KEYSTORE_FILE="$keystore"
          export ORG_GRADLE_PROJECT_JELLY_TUBE_KEYSTORE_PASSWORD="$KEYSTORE_PASSWORD"
          export ORG_GRADLE_PROJECT_JELLY_TUBE_KEY_ALIAS="$KEY_ALIAS"
          export ORG_GRADLE_PROJECT_JELLY_TUBE_KEY_PASSWORD="$KEY_PASSWORD"
          # 빈 문자열도 속성으로 잡혀 mapping 업로드를 켜므로, 토큰이 있을 때만 넘긴다.
          if [[ -n "$SENTRY_AUTH_TOKEN" ]]; then
            export ORG_GRADLE_PROJECT_JELLY_TUBE_SENTRY_AUTH_TOKEN="$SENTRY_AUTH_TOKEN"
          fi
          ./gradlew :android:app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  # 서명하지 않은 IPA 다. SideStore 가 설치할 때 사용자 Apple ID 로 서명한다.
  ios-ipa:
    needs: mobile-release-needed
    # 수동 실행에서는 앞 job 이 건너뛰어지므로, 건너뛴 의존을 막지 않게 !cancelled() 로 연다.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || needs.mobile-release-needed.outputs.needed == 'true') }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: gradle/actions/setup-gradle@v4
      - run: ./scripts/setup-ios-vendor.sh
      - name: Archive without signing
        run: |
          set -euo pipefail
          xcodebuild archive \
            -project ios/app/JellyTubeIos.xcodeproj -scheme JellyTubeIos -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/JellyTube.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Package the IPA
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          mkdir Payload
          cp -R JellyTube.xcarchive/Products/Applications/JellyTubeIos.app Payload/
          zip -qry "$GITHUB_WORKSPACE/JellyTube.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ipa
          path: JellyTube.ipa
          if-no-files-found: error

  mobile-release:
    needs: [versions, android-apk, ios-ipa]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.versions.outputs.mobile }}
      TAG: mobile/v${{ needs.versions.outputs.mobile }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        run: |
          set -euo pipefail
          # 지정하지 않으면 직전 릴리스부터 모으는데, desktop 릴리스가 끼면 범위가 어긋난다.
          previous=$(git tag -l 'mobile/v*' --sort=-v:refname | grep -vxF "$TAG" | head -n1 || true)
          gh release create "$TAG" dist/* --verify-tag --title "JellyTube $VERSION" \
            --generate-notes ${previous:+--notes-start-tag "$previous"}
      # SideStore 소스는 releases/latest/download/source.json 으로 구독한다. 최신 릴리스가 늘 이 파일을 갖는다.
      - name: Attach the SideStore source
        run: |
          set -euo pipefail
          config=buildSrc/src/main/java/com/kintmin/buildSrc/AppConfiguration.kt
          code=$(sed -n 's/^ *const val VERSION_CODE = \([0-9]*\)$/\1/p' "$config")
          pbxproj=ios/app/JellyTubeIos.xcodeproj/project.pbxproj
          bundle_id=$(sed -n 's/.*PRODUCT_BUNDLE_IDENTIFIER = \(.*\);/\1/p' "$pbxproj" | grep -v 'Tests$' | sort -u)
          min_os=$(sed -n 's/.*IPHONEOS_DEPLOYMENT_TARGET = \(.*\);/\1/p' "$pbxproj" | sort -uV | tail -n1)
          [[ -n "$code" && -n "$bundle_id" && -n "$min_os" ]] || { echo "::error::source.json 에 넣을 값을 읽지 못했다"; exit 1; }
          release=$(gh release view "$TAG" --json body,publishedAt,assets)
          jq -n \
            --argjson release "$release" \
            --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" \
            --arg version "$VERSION" --arg code "$code" \
            --arg bundle_id "$bundle_id" --arg min_os "$min_os" '
            ($release.assets[] | select(.name == "JellyTube.ipa")) as $ipa | {
              name: "JellyTube",
              identifier: "com.kintmin.jellytube.source",
              sourceURL: "https://github.com/\($repo)/releases/latest/download/source.json",
              apps: [{
                name: "JellyTube",
                bundleIdentifier: $bundle_id,
                developerName: "kintmin",
                localizedDescription: "JellyTube",
                iconURL: "https://raw.githubusercontent.com/\($repo)/\($sha)/ios/app/JellyTubeIos/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png",
                versions: [{
                  version: $version,
                  buildVersion: $code,
                  date: $release.publishedAt,
                  localizedDescription: $release.body,
                  downloadURL: $ipa.url,
                  size: $ipa.size,
                  minOSVersion: $min_os
                }],
                appPermissions: { entitlements: [], privacy: {} }
              }],
              news: []
            }' > source.json
          gh release upload "$TAG" source.json

  sync-develop:
    if: github.event_name == 'push'
    needs: tag
    runs-on: ubuntu-latest
    steps:
      - name: Require the develop push key
        env:
          KEY: ${{ secrets.DEVELOP_SYNC_DEPLOY_KEY }}
        run: |
          [[ -n "$KEY" ]] || { echo "::error::DEVELOP_SYNC_DEPLOY_KEY 시크릿이 없다. develop ruleset 은 배포 키만 직접 push 를 허용한다."; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: develop
          fetch-depth: 0
          ssh-key: ${{ secrets.DEVELOP_SYNC_DEPLOY_KEY }}
      - name: Merge main into develop
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git merge --no-ff --no-edit -m "merge/main 의 릴리스를 develop 에 반영한다" origin/main; then
            git push origin HEAD:develop
          else
            git merge --abort
            echo "::error::main 과 develop 이 충돌한다. 로컬에서 develop 에 origin/main 을 merge 해 충돌을 풀고, 그 PR 을 merge commit 으로 병합한다(관리자 bypass)."
            exit 1
          fi
